<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FCFCFC" />
  <meta name="robots" content="noindex" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="صدیقی" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>عملیات آفلاین صدیقی</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/x-icon" href="/images/app-icon.ico" />
  <link rel="icon" type="image/png" sizes="192x192" href="/images/app-icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/app-icon-180.png" />
  <link rel="stylesheet" href="/offline/offline.css" />
  <script type="module" src="/offline/js/app.js"></script>
</head>
<body>
  <header class="ox-top">
    <div class="ox-brand">
      <img src="/images/saddiqi-loader-symbol.png" alt="" width="32" height="32" />
      <div>
        <strong>گروپ کمپنی‌های فواد صدیقی</strong>
        <small data-profile-name>کار آنلاین و آفلاین</small>
      </div>
    </div>
    <div class="ox-top-actions">
      <span class="ox-conn" data-conn="OFFLINE" role="status" aria-live="polite">
        <span class="ox-dot" aria-hidden="true"></span><span data-conn-text>در حال بررسی…</span>
      </span>
      <button type="button" class="ox-btn ox-btn--ghost" data-sync-now hidden>همگام‌سازی</button>
    </div>
  </header>

  <div class="ox-banner" data-banner hidden></div>

  <main id="ox-main" class="ox-main" tabindex="-1">
    <section class="ox-card"><p>در حال بارگذاری سیستم آفلاین صدیقی…</p></section>
  </main>

  <nav class="ox-tabs" data-tabs hidden aria-label="بخش‌ها">
    <a href="/">سیستم صدیقی</a>
    <a href="#/ops" data-tab="ops">عملیات <span class="ox-badge" data-pending-badge hidden></span></a>
    <a href="#/backup" data-tab="backup">بکاپ</a>
    <a href="#/settings" data-tab="settings">تنظیمات</a>
  </nav>

  <div class="ox-toast" data-toast role="status" aria-live="polite" hidden></div>

  <noscript><p class="ox-card">برای استفاده از سیستم آفلاین صدیقی، JavaScript مرورگر باید فعال باشد.</p></noscript>
</body>
</html>
